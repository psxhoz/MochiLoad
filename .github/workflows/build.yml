name: Build MochiLoad

# Builds an unsigned MochiLoad.ipa on every push to main (or by hand from
# the Actions tab) and puts it on the "latest-build" release.
# MochiLoad re-signs itself with the user's Apple ID when installed,
# so the IPA is only fake-signed here.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'source.json'
      - 'assets/**'
      - 'apps/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install tools
        run: brew install ldid

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: latest-stable

      - name: Version
        run: |
          # MochiLoad: every build gets a higher version (1.0.<run>) so the app can see updates.
          MOCHI_VERSION="1.0.${{ github.run_number }}"
          sed -i '' -E "s/^MARKETING_VERSION = .*/MARKETING_VERSION = ${MOCHI_VERSION}/" Build.xcconfig
          sed -i '' -E "s/^CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = ${{ github.run_number }}/" Build.xcconfig
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" Build.xcconfig
          echo "MOCHI_VERSION=${MOCHI_VERSION}" | tee -a "$GITHUB_ENV"
          SHORT=$(git rev-parse --short HEAD)
          echo "VERSION=${MOCHI_VERSION}+${SHORT}" | tee -a "$GITHUB_ENV"

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: xcode-${{ runner.os }}-${{ github.sha }}
          restore-keys: xcode-${{ runner.os }}-

      - name: Build
        run: |
          mkdir -p build/logs
          set -o pipefail
          make -B build > build/logs/build.log 2>&1 || {
            echo "=== COMPILE ERRORS ==="
            grep -E "error:" build/logs/build.log | grep -v "Swift 6" | sort -u | head -60
            tail -n 40 build/logs/build.log
            exit 1
          }
          tail -n 50 build/logs/build.log
          # The backup helper (SideBackup.ipa) is built into build/ but nothing
          # copies it into the app bundle; the app looks for it there at runtime.
          cp build/SideBackup.ipa SideStore.xcarchive/Products/Applications/SideStore.app/SideBackup.ipa
          make fakesign
          make ipa
          mv SideStore.ipa MochiLoad.ipa

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/logs

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MochiLoad-${{ env.VERSION }}
          path: MochiLoad.ipa

      - name: Publish to the latest-build release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). Version ${VERSION}."
          if gh release view latest-build >/dev/null 2>&1; then
            gh release edit latest-build --title "MochiLoad (latest build)" --notes "$NOTES" --prerelease
            git tag -f latest-build && git push -f origin latest-build
          else
            gh release create latest-build --title "MochiLoad (latest build)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload latest-build MochiLoad.ipa --clobber
          # Remove the IPA from before the rename so nobody downloads the old app
          gh release delete-asset latest-build MochiChanger.ipa -y || true

      - name: Tell MochiLoad about the new version
        if: github.ref == 'refs/heads/main'
        run: |
          SIZE=$(stat -f%z MochiLoad.ipa)
          NOTES=$(git log -1 --pretty=%s)
          git checkout -- Build.xcconfig
          git pull --ff-only origin main || true
          python3 scripts/mochi/update_source.py com.psxhoz.MochiLoad "$MOCHI_VERSION" "${{ github.run_number }}" "$SIZE" \
            "https://github.com/psxhoz/MochiLoad/releases/download/latest-build/MochiLoad.ipa" "$NOTES"
          git config user.name "MochiLoad Bot"
          git config user.email "actions@users.noreply.github.com"
          git add source.json
          git commit -m "Source: MochiLoad $MOCHI_VERSION [skip ci]" && git push origin HEAD:main || echo "source.json unchanged"
